# Pipeline Orion : réception des logs applicatifs et indexation Elasticsearch
input {
  tcp {
    port => 5000
    # winston-logstash émet un objet JSON par ligne : aucun parsing à écrire
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Un index par jour : purge simple des vieux logs (suppression d'index)
    index => "orion-logs-%{+YYYY.MM.dd}"
  }
}
